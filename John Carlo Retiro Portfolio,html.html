<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="./">
<title>John Carlo Retiro - Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{font-family:'Inter',sans-serif}
  h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}
  body{background:#0E1016;color:#E8EDF5;overflow-x:hidden}
  .bg-grid{
    background-image: radial-gradient(circle at 20% 10%, rgba(138,180,255,0.15), transparent 40%),
                      radial-gradient(circle at 80% 30%, rgba(99,102,241,0.12), transparent 35%),
                      radial-gradient(circle at 50% 80%, rgba(138,180,255,0.08), transparent 40%);
  }
  .card{background:rgba(28,33,47,0.85);border:1px solid #2A3142;backdrop-filter:blur(12px)}
  .card-hover:hover{border-color:#3A4254;transform:translateY(-2px);transition:all .3s ease}
  .btn-primary{background:#8AB4FF;color:#0E1016;box-shadow:0 0 0 1px rgba(138,180,255,0.3), 0 8px 24px rgba(138,180,255,0.25);transition:all .25s}
  .btn-primary:hover{background:#A3C6FF;transform:translateY(-1px);box-shadow:0 0 0 1px rgba(163,198,255,0.4), 0 12px 32px rgba(138,180,255,0.35)}
  .btn-ghost{background:rgba(28,33,47,0.8);border:1px solid #2A3142;color:#E8EDF5;transition:all .25s}
  .btn-ghost:hover{background:#262C3B;border-color:#3A4254}
  .btn-social{background:#0E1016;border:1px solid #2A3142;color:#CBD5E1;transition:all .25s}
  .btn-social:hover{border-color:#8AB4FF;color:#8AB4FF;transform:translateY(-1px)}
  .reveal{opacity:0;transform:translateY(28px) scale(0.98);filter:blur(6px);transition:all 0.8s cubic-bezier(.16,1,.3,1)}
  .reveal.is-visible{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  .photo-glow{box-shadow:0 0 0 1px #2A3142, 0 0 40px rgba(138,180,255,0.15)}
  html{scroll-behavior:smooth}
  .scroll-target{scroll-margin-top:110px}
  body{scroll-behavior:smooth;transition:background-color .35s ease}
  .card, .btn-primary, .btn-ghost, .btn-social{transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease, background-color .3s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,0.28)}
  .btn-primary:hover, .btn-ghost:hover, .btn-social:hover{transform:translateY(-2px) scale(1.01)}
</style>
</head>

<script>
function scrollToSection(hash){
  if(!hash || !hash.startsWith('#')) return;
  const id = hash.slice(1);
  const target = document.getElementById(id);
  if(!target) return;
  target.scrollIntoView({behavior:'smooth', block:'start'});
  history.replaceState(null, '', hash);
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('a[href^="#"]');
  if(!link) return;
  const hash = link.getAttribute('href');
  if(!hash || hash === '#') {
    e.preventDefault();
    scrollToSection('#contact');
    return;
  }
  e.preventDefault();
  scrollToSection(hash);
});

  const obs = new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');obs.unobserve(e.target)}})},{threshold:0.12, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}
function sendMail(e){
  e.preventDefault();
  const n=document.getElementById('cname').value;
  const m=document.getElementById('cmsg').value;
  window.location.href=`mailto:${CONFIG.contact.email}?subject=Job Opportunity from ${encodeURIComponent(n)}&body=${encodeURIComponent(m)}`;
}
